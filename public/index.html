<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SA!R - OTP Dispatch Dashboard</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #0f172a;
      color: #f8fafc;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .dashboard-card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 16px;
      width: 100%;
      max-width: 500px;
      padding: 32px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
    }

    .brand-header {
      text-align: center;
      margin-bottom: 24px;
    }

    .brand-header h1 {
      font-size: 2.5rem;
      color: #38bdf8;
      letter-spacing: 2px;
      font-weight: 800;
    }

    .brand-header p {
      color: #94a3b8;
      font-size: 0.9rem;
      margin-top: 4px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
      color: #cbd5e1;
    }

    .input-container {
      display: flex;
      align-items: center;
      background: #0f172a;
      border: 2px solid #334155;
      border-radius: 8px;
      padding: 0 12px;
      transition: border-color 0.2s;
    }

    .input-container:focus-within {
      border-color: #38bdf8;
    }

    .prefix {
      color: #38bdf8;
      font-weight: bold;
      font-size: 1.1rem;
      margin-right: 8px;
    }

    input[type="tel"] {
      width: 100%;
      background: transparent;
      border: none;
      outline: none;
      color: #fff;
      font-size: 1.1rem;
      padding: 12px 0;
      letter-spacing: 1px;
    }

    .btn-send {
      width: 100%;
      background: linear-gradient(135deg, #0284c7, #2563eb);
      color: white;
      border: none;
      padding: 14px;
      font-size: 1rem;
      font-weight: 700;
      border-radius: 8px;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.1s;
    }

    .btn-send:hover {
      opacity: 0.9;
    }

    .btn-send:active {
      transform: scale(0.98);
    }

    .btn-send:disabled {
      background: #475569;
      cursor: not-allowed;
    }

    .logs-container {
      margin-top: 24px;
      max-height: 250px;
      overflow-y: auto;
      background: #0f172a;
      border-radius: 8px;
      padding: 12px;
      border: 1px solid #334155;
      display: none;
    }

    .log-item {
      font-size: 0.85rem;
      padding: 8px;
      border-bottom: 1px solid #1e293b;
    }

    .log-item:last-child {
      border-bottom: none;
    }

    .log-otp {
      color: #4ade80;
      font-weight: bold;
    }

    .log-note {
      color: #93c5fd;
    }

    .status-badge {
      display: inline-block;
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 0.75rem;
      background: #0369a1;
      color: #fff;
      margin-right: 6px;
    }
  </style>
</head>
<body>

  <div class="dashboard-card">
    <div class="brand-header">
      <h1>SA!R</h1>
      <p>Automated 10-OTP & Note Dispatcher</p>
    </div>

    <div class="form-group">
      <label for="phone">Enter Number:</label>
      <div class="input-container">
        <span class="prefix">+</span>
        <input 
          type="tel" 
          id="phone" 
          placeholder="263772402082" 
          autocomplete="off"
        />
      </div>
    </div>

    <button class="btn-send" id="sendBtn" onclick="triggerOTPs()">Send OTPs (10 Messages)</button>

    <div class="logs-container" id="logsContainer"></div>
  </div>

  <script>
    async function triggerOTPs() {
      const phoneInput = document.getElementById('phone');
      const sendBtn = document.getElementById('sendBtn');
      const logsContainer = document.getElementById('logsContainer');

      const number = phoneInput.value.trim();
      if (!number) {
        alert('Please enter a valid phone number.');
        return;
      }

      sendBtn.disabled = true;
      sendBtn.innerText = 'Sending 10 Messages...';
      logsContainer.style.display = 'block';
      logsContainer.innerHTML = '<div class="log-item">Initializing dispatch process...</div>';

      try {
        const response = await fetch('/api/send-otps', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ phoneNumber: number })
        });

        const data = await response.json();

        if (data.success) {
          logsContainer.innerHTML = '';
          data.details.forEach((item) => {
            const logElement = document.createElement('div');
            logElement.className = 'log-item';
            
            const isOTP = item.index === 1;
            const classType = isOTP ? 'log-otp' : 'log-note';

            logElement.innerHTML = `
              <span class="status-badge">#${item.index}</span>
              <span class="${classType}">${item.content}</span>
            `;
            logsContainer.appendChild(logElement);
          });
        } else {
          logsContainer.innerHTML = `<div class="log-item" style="color: #f87171;">Error: ${data.error}</div>`;
        }
      } catch (err) {
        logsContainer.innerHTML = `<div class="log-item" style="color: #f87171;">Request failed: ${err.message}</div>`;
      } finally {
        sendBtn.disabled = false;
        sendBtn.innerText = 'Send OTPs (10 Messages)';
      }
    }
  </script>
</body>
        </html>
